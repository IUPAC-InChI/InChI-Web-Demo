<button type="button" class="btn btn-primary mask-open mt-2">
  Report a problem
</button>

<!--
  A native <dialog> supplies the modal behaviour this form needs: focus is
  trapped while it is open, Escape closes it, the page behind it is inert and
  focus returns to the "Report a problem" button on close.
  Ids are suffixed per tab by scopeIds() because this component is rendered once
  per tab; "for" and "aria-labelledby" resolve to the first matching id in the
  document, so unscoped ids would wire the second dialog to the first one.
-->
<dialog class="inchi-dialog mask-dialog" aria-labelledby="maskTitle">
  <div class="inchi-dialog-body">
    <header>
      <h2 id="maskTitle">Report a problem</h2>
      <button type="button" class="mask-close" aria-label="Close dialog">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </header>

    <form>
      <p class="mask-intro">
        Your structure, the generated InChI and InChIKey, the options you
        selected and the log are sent with your description.
      </p>

      <label class="mask-label" for="nameInput"
        >Your name or email <span class="mask-optional">(optional)</span></label
      >
      <input
        type="text"
        id="nameInput"
        class="mask-name"
        maxlength="200"
        autocomplete="name"
        placeholder="So we can follow up with you"
      />

      <label class="mask-label" for="descriptionInput"
        >What is wrong with this structure?</label
      >
      <textarea
        rows="5"
        id="descriptionInput"
        class="mask-description"
        maxlength="4000"
        placeholder="e.g. the stereo descriptor is missing for the double bond"
        required
      ></textarea>

      <div class="disclaimer-section">
        <label for="disclaimerCheckbox" class="disclaimer-label">
          <input
            type="checkbox"
            id="disclaimerCheckbox"
            class="disclaimer-checkbox"
            required
          />
          <span
            >I acknowledge that this report will be submitted for review and may
            be publicly shared to improve the InChI library.</span
          >
        </label>
      </div>
      <div class="mask-actions">
        <button type="button" class="btn btn-outline-secondary mask-cancel">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary mask-submit">
          Send report
        </button>
      </div>
    </form>
  </div>
</dialog>
