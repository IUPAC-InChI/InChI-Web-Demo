<!--
  Native <dialog> for the same reasons as report-mask.html. role="alertdialog"
  marks it as an interruption that needs acknowledgement; the icon is decorative
  because the title and message already carry the outcome.
-->
<dialog
  class="inchi-dialog feedback-dialog"
  role="alertdialog"
  aria-labelledby="feedbackTitle"
  aria-describedby="feedbackMessage"
>
  <div class="inchi-dialog-body">
    <div class="feedback-icon">
      <i class="feedback-glyph" aria-hidden="true"></i>
    </div>

    <h2 id="feedbackTitle"></h2>
    <p id="feedbackMessage"></p>

    <button type="button" class="btn btn-primary feedback-confirm">OK</button>
  </div>
</dialog>
