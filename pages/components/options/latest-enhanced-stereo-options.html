<div class="row">
  <div class="col">
    <div class="form-check">
      <input
        data-id="includeStereo"
        class="form-check-input"
        type="checkbox"
        data-inchi-option-off="SNon"
        data-default-checked
        checked
      />
      <label class="form-check-label">Include Stereo:</label>
    </div>
  </div>
  <div class="col">
    <fieldset>
      <legend class="visually-hidden">Stereochemistry to report</legend>
    <div class="form-check ms-4 ms-xl-0">
      <input
        data-id="EnhancedStereochemistry"
        class="form-check-input"
        data-inchi-sub-option
        type="radio"
        name="stereoRadio"
        data-inchi-option-on="EnhancedStereochemistry"
        data-inchi-stereo-option
        data-default-checked
        checked
      />
      <label class="form-check-label">
        Enhanced Stereochemistry
        <button
          type="button"
          class="option-help"
          popovertarget="help-EnhancedStereochemistry"
          aria-label="What “Enhanced Stereochemistry” does"
        >
          ?
        </button>
      </label>
      <!-- Outside the label: see the note in base-options.html. -->
      <div id="help-EnhancedStereochemistry" popover class="option-help-panel">
        <p>
          The functionality for enhanced stereochemistry is a work in progress.
          You can expect to encounter warnings.
        </p>
        <p>
          <b>Note:</b> enhanced stereochemistry is only supported in the V3000
          molfile format.
        </p>
      </div>
    </div>
    <div class="form-check ms-4 ms-xl-0">
      <input
        data-id="SAbs"
        class="form-check-input"
        data-inchi-sub-option
        type="radio"
        name="stereoRadio"
        data-inchi-stereo-option
      />
      <label class="form-check-label">Absolute</label>
    </div>
    <div class="form-check ms-4 ms-xl-0">
      <input
        data-id="SRel"
        class="form-check-input"
        data-inchi-sub-option
        type="radio"
        name="stereoRadio"
        data-inchi-option-on="SRel"
        data-inchi-stereo-option
      />
      <label class="form-check-label">Relative</label>
    </div>
    <div class="form-check ms-4 ms-xl-0">
      <input
        data-id="SRac"
        class="form-check-input"
        data-inchi-sub-option
        type="radio"
        name="stereoRadio"
        data-inchi-option-on="SRac"
        data-inchi-stereo-option
      />
      <label class="form-check-label">Racemic</label>
    </div>
    <div class="form-check ms-4 ms-xl-0">
      <input
        data-id="SUCF"
        class="form-check-input"
        data-inchi-sub-option
        type="radio"
        name="stereoRadio"
        data-inchi-option-on="SUCF"
        data-inchi-stereo-option
      />
      <label class="form-check-label">From chiral flag</label>
    </div>
    </fieldset>
  </div>
</div>
<div class="form-check ms-4">
  <input
    data-id="SUU"
    class="form-check-input"
    data-inchi-sub-option
    type="checkbox"
    data-inchi-option-on="SUU"
    data-inchi-stereo-option
  />
  <label class="form-check-label"
    >Always include omitted/undefined stereo</label
  >
</div>
<div class="form-check ms-4">
  <input
    data-id="SLUUD"
    class="form-check-input"
    data-inchi-sub-option
    type="checkbox"
    data-inchi-option-on="SLUUD"
    data-inchi-stereo-option
  />
  <label class="form-check-label"
    >Different marks for unknown/undefined stereo</label
  >
</div>
<div class="form-check ms-4">
  <input
    data-id="NEWPSOFF"
    class="form-check-input"
    data-inchi-sub-option
    type="checkbox"
    data-inchi-option-on="NEWPSOFF"
    data-inchi-stereo-option
  />
  <label class="form-check-label"
    >Both ends of wedge point to stereocenters</label
  >
</div>
