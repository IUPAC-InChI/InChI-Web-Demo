<!--
  Grouped in a <fieldset> because the options are meaningless without the
  heading.
-->
<fieldset class="option-group">
  <legend class="option-group-legend">Tautomer options</legend>
  <div class="form-check">
    <input
      data-id="KET"
      class="form-check-input"
      type="checkbox"
      data-inchi-option-on="KET"
      data-inchi-tautomer-option
    />
    <label class="form-check-label" title="Keto-enol tautomerism">KET</label>
  </div>
  <div class="form-check">
    <input
      data-id="15T"
      class="form-check-input"
      type="checkbox"
      data-inchi-option-on="15T"
      data-inchi-tautomer-option
    />
    <label class="form-check-label" title="1,5-tautomerism">15T</label>
  </div>
  <div class="form-check">
    <input
      data-id="PT_06_00"
      class="form-check-input"
      type="checkbox"
      data-inchi-option-on="PT_06_00"
      data-inchi-tautomer-option
    />
    <label class="form-check-label" title="1,3 heteroatom H-shift"
      >PT_06_00</label
    >
  </div>
  <div class="form-check">
    <input
      data-id="PT_13_00"
      class="form-check-input"
      type="checkbox"
      data-inchi-option-on="PT_13_00"
      data-inchi-tautomer-option
    />
    <label class="form-check-label" title="Keten-inol exchange">PT_13_00</label>
  </div>
  <div class="form-check">
    <input
      data-id="PT_16_00"
      class="form-check-input"
      type="checkbox"
      data-inchi-option-on="PT_16_00"
      data-inchi-tautomer-option
    />
    <label class="form-check-label" title="Nitroso/oxime">PT_16_00</label>
  </div>
  <div class="form-check">
    <input
      data-id="PT_18_00"
      class="form-check-input"
      type="checkbox"
      data-inchi-option-on="PT_18_00"
      data-inchi-tautomer-option
    />
    <label class="form-check-label" title="Cyanic/iso-cyanic acids"
      >PT_18_00</label
    >
  </div>
  <div class="form-check">
    <input
      data-id="PT_22_00"
      class="form-check-input"
      type="checkbox"
      data-inchi-option-on="PT_22_00"
      data-inchi-tautomer-option
    />
    <label class="form-check-label" title="Imine/imine">PT_22_00</label>
  </div>
  <div class="form-check">
    <input
      data-id="PT_39_00"
      class="form-check-input"
      type="checkbox"
      data-inchi-option-on="PT_39_00"
      data-inchi-tautomer-option
    />
    <label
      class="form-check-label"
      title="Nitrone/azoxy or Behrend rearrangement"
      >PT_39_00</label
    >
  </div>
</fieldset>
