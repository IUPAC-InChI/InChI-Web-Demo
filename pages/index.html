<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) works on notched phones. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>InChI Web Demo</title>

    <link
      href="bootstrap/bootstrap-5.2.3-dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link
      href="bootstrap-icons/bootstrap-icons-1.10.3/bootstrap-icons.css"
      rel="stylesheet"
      integrity="sha384-b6lVK+yci+bfDmaY1u0zE8YYJt0TZxLEAFyYSLHId4xoVvsrQu3INevFKo+Xir8e"
      crossorigin="anonymous"
    />
    <link
      href="bootstrap-multiselect/bootstrap-multiselect-1.1.2/dist/css/bootstrap-multiselect.min.css"
      rel="stylesheet"
      integrity="sha384-sRRK8QIx/nQdgIMFawlqpzKW5yaVcx63vbU82I9nuHAdsQN/blJQNrf6GORupDMI"
      crossorigin="anonymous"
    />

    <!--
      App stylesheets load after the framework so that app rules win ties
      without "!important". tokens.css comes first: it defines the design tokens
      and the --bs-* hooks that brand Bootstrap's own components.
    -->
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/index.css" rel="stylesheet" />
    <link href="css/report-mask.css" rel="stylesheet" />
    <link href="css/report-feedback.css" rel="stylesheet" />

    <!--
      The InChI modules (one per version), the RInChI module and the NGL viewer
      are not listed here: together they are more than 10 MB, and a visit needs
      one InChI version at most. index.js pulls them in through loadScriptOnce()
      when a tab is opened or a conversion is about to run.

      Everything below is deferred, so none of it blocks the parser. Deferred
      scripts still run in document order, which is what lets the plugins below
      rely on jQuery and the components rely on all of it.
    -->
    <!-- Only bootstrap-multiselect needs jQuery. -->
    <script
      defer
      src="jquery/jquery-3.7.1.min.js"
      integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="bootstrap/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="bootstrap-multiselect/bootstrap-multiselect-1.1.2/dist/js/bootstrap-multiselect.min.js"
      integrity="sha384-0bKqY/QpXas8sskCT4hKi1EsfrCHXH7kZYNMr05pTeUbEdxf5xdjxEy1fjdU861x"
      crossorigin="anonymous"
    ></script>
    <script defer src="inchi.js"></script>
    <script defer src="rinchi.js"></script>
    <script defer src="index.js"></script>
    <script defer src="components/components.js"></script>
    <script>
      var _paq = (window._paq = window._paq || []);
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(["trackPageView"]);
      _paq.push(["enableLinkTracking"]);
      (function () {
        var u = "https://matomo.beilstein.org/";
        _paq.push(["setTrackerUrl", u + "matomo.php"]);
        _paq.push(["setSiteId", "10"]);
        var d = document,
          g = d.createElement("script"),
          s = d.getElementsByTagName("script")[0];
        g.async = true;
        g.src = u + "matomo.js";
        s.parentNode.insertBefore(g, s);
      })();
    </script>
  </head>
  <body>
    <div class="container-md" style="margin-bottom: 2rem">
      <div class="row mt-1">
        <div class="col-md-3">
          <a href="https://www.inchi-trust.org/" target="_blank">
            <img
              style="height: 80px; width: auto"
              src="img/InChI-logo2.png"
              alt="InChI Trust Logo"
            />
          </a>
        </div>
        <h1 class="col-md-9 mt-auto">InChI Web Demo</h1>
      </div>
      <noscript>You need to enable JavaScript!</noscript>

      <ul class="nav nav-pills mt-1" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="pills-inchi-tab"
            data-bs-toggle="pill"
            data-bs-target="#pills-inchi"
            type="button"
            role="tab"
            aria-controls="pills-inchi"
            aria-selected="true"
          >
            InChI
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="pills-rinchi-tab"
            data-bs-toggle="pill"
            data-bs-target="#pills-rinchi"
            type="button"
            role="tab"
            aria-controls="pills-rinchi"
            aria-selected="false"
          >
            RInChI
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="pills-about-tab"
            data-bs-toggle="pill"
            data-bs-target="#pills-about"
            type="button"
            role="tab"
            aria-controls="pills-about"
            aria-selected="false"
          >
            About
          </button>
        </li>
      </ul>

      <!-- Contents of pills -->
      <div class="tab-content">
        <!-- InChI pill -->
        <inchi-inchi-tools
          class="tab-pane fade show active"
          id="pills-inchi"
          role="tabpanel"
          aria-labelledby="pills-inchi-tab"
          tabindex="0"
        ></inchi-inchi-tools>

        <!-- RInChI pill -->
        <inchi-rinchi-tools
          class="tab-pane fade"
          id="pills-rinchi"
          role="tabpanel"
          aria-labelledby="pills-rinchi-tab"
          tabindex="0"
        ></inchi-rinchi-tools>

        <!-- About pill -->
        <inchi-about
          class="tab-pane fade"
          id="pills-about"
          role="tabpanel"
          tabindex="0"
        ></inchi-about>
      </div>
    </div>
  </body>
</html>
