<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) works on notched phones. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>InChI Web App — generate InChI, InChIKey and RInChI in your browser</title>
    <meta
      name="description"
      content="Generate InChI, InChIKey, AuxInfo and RInChI from a drawn structure, a molfile, AuxInfo or an SD file. Runs entirely in your browser: structures are never sent to a server. Compare output across InChI algorithm versions, including development branches and open pull requests."
    />
    <meta name="color-scheme" content="light dark" />

    <!--
      The stored theme choice, applied before first paint. This has to be
      inline and blocking: read it from index.js instead and the page paints
      once in the system theme and then flips, which is worse than no toggle
      at all. Absent a stored choice, nothing is set and the media queries in
      css/tokens.css follow the system preference.
    -->
    <script>
      try {
        var storedTheme = localStorage.getItem("inchi-theme");
        if (storedTheme === "light" || storedTheme === "dark") {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch (error) {
        /* Private mode or blocked storage: the system preference stands. */
      }
    </script>

    <link
      href="bootstrap/bootstrap-5.2.3-dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />

    <!--
      App stylesheets load after the framework so that app rules win ties
      without "!important". tokens.css comes first: it defines the design tokens
      and the --bs-* hooks that brand Bootstrap's own components.
    -->
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/index.css" rel="stylesheet" />
    <link href="css/report-mask.css" rel="stylesheet" />
    <link href="css/report-feedback.css" rel="stylesheet" />

    <!--
      The InChI modules (one per version), the RInChI module and the NGL viewer
      are not listed here: together they are more than 10 MB, and a visit needs
      one InChI version at most. index.js pulls them in through loadScriptOnce()
      when a tab is opened or a conversion is about to run.

      Everything below is deferred, so none of it blocks the parser. Deferred
      scripts still run in document order, which is what lets the components
      rely on everything above them.
    -->
    <script
      defer
      src="bootstrap/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
    <!-- The theme control, shared with about.html. -->
    <script defer src="theme.js"></script>
    <!-- What the paste field was handed: pure, no dependencies of its own. -->
    <script defer src="input-format.js"></script>
    <!-- The InChI string's layer grammar: needed before the components render. -->
    <script defer src="inchi-layers.js"></script>
    <script defer src="inchi.js"></script>
    <script defer src="rinchi.js"></script>
    <script defer src="index.js"></script>
    <script defer src="components/components.js"></script>
    <script>
      var _paq = (window._paq = window._paq || []);
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(["trackPageView"]);
      _paq.push(["enableLinkTracking"]);
      (function () {
        var u = "https://matomo.beilstein.org/";
        _paq.push(["setTrackerUrl", u + "matomo.php"]);
        _paq.push(["setSiteId", "10"]);
        var d = document,
          g = d.createElement("script"),
          s = d.getElementsByTagName("script")[0];
        g.async = true;
        g.src = u + "matomo.js";
        s.parentNode.insertBefore(g, s);
      })();
    </script>
  </head>
  <!-- Type 3270. -->
  <body>
    <!--
      DIRECTION CONTRACT — Soft Modern

      THESIS: The identifier is drawn, not printed — read as keyed layers
      rather than one opaque run. Refuses this category's default arrangement:
      four identical cards holding answer, derived answer, diagnostic dump and
      error channel as peers.

      OWN-WORLD: A thing is bounded by the surface it sits on, not by a line
      around it. Plates are lifted cards — 12px corners, a soft shadow, a quiet
      hairline — on a faintly green-grey ground, both themes first-class. One
      institutional green, colour nowhere else except the categorical atom key.
      The line jobs split by purpose rather than weight: a hairline separates
      rows, `rule` bounds a control at 3:1, a 3px stroke marks the active or
      divergent thing. Tracked small-caps apparatus labels. System mono for
      identifiers only, where character alignment is the data.

      STORY: A developer draws or pastes, reads the identifier as keyed layers
      rather than one opaque run, pins it, switches version, and sees which
      layer moved.

      FIRST VIEWPORT: Masthead on the page grid. One surface, no tabs: the
      editor and what fills it on the left, version and options beneath them
      as margin apparatus, and the identifier on the right as a keyed notation
      plate stamped with the version that produced it. What the editor holds
      decides which identifier appears — a molecule yields an InChI, a
      reaction a RInChI — so there is no mode for the visitor to set.

      DEVIATION (cited): the status line sits ABOVE the plate, not beneath it
      as this block first specified. It answers "did that work?", which is read
      before the answer itself, and on a failure there is no plate to read
      under. The announcement it drives is a separate always-present region,
      because a hidden node is out of the accessibility tree.

      FORM: Soft Modern, adopted from a six-way comparison of token sets.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div class="page-shell">
      <header class="masthead">
        <a
          href="https://www.inchi-trust.org/"
          target="_blank"
          rel="noopener"
          class="flex-none"
        >
          <img
            class="masthead-logo"
            src="img/InChI-logo2.png"
            width="180"
            height="56"
            alt="InChI Trust"
          />
        </a>
        <div class="masthead-text">
          <h1>InChI Web App</h1>
          <p class="masthead-tagline">
            Chemical identifiers generated in your browser, never on a server.
          </p>
        </div>

        <a class="masthead-link" href="about.html">About</a>

        <!--
          role="switch" rather than a checkbox: this is a two-state control
          whose accessible name stays put while its state changes, so the name
          lives on aria-label and the visible label reports the current mode.
        -->
        <button
          type="button"
          class="theme-switch"
          role="switch"
          aria-checked="false"
          aria-label="Dark mode"
          data-theme-switch
        >
          <span class="theme-switch-mode apparatus" data-theme-switch-label
            >Light</span
          >
          <span class="theme-switch-track" aria-hidden="true">
            <span class="theme-switch-knob"></span>
          </span>
        </button>
      </header>
      <noscript>You need to enable JavaScript!</noscript>

      <inchi-workbench></inchi-workbench>
    </div>
  </body>
</html>
