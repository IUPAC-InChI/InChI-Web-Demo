<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) works on notched phones. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>InChI Web Demo — generate InChI, InChIKey and RInChI in your browser</title>
    <meta
      name="description"
      content="Generate InChI, InChIKey, AuxInfo and RInChI from a drawn structure, a molfile, AuxInfo or an SD file. Runs entirely in your browser: structures are never sent to a server. Compare output across InChI algorithm versions, including development branches and open pull requests."
    />
    <meta name="color-scheme" content="light dark" />

    <link
      href="bootstrap/bootstrap-5.2.3-dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link
      href="bootstrap-multiselect/bootstrap-multiselect-1.1.2/dist/css/bootstrap-multiselect.min.css"
      rel="stylesheet"
      integrity="sha384-sRRK8QIx/nQdgIMFawlqpzKW5yaVcx63vbU82I9nuHAdsQN/blJQNrf6GORupDMI"
      crossorigin="anonymous"
    />

    <!--
      App stylesheets load after the framework so that app rules win ties
      without "!important". tokens.css comes first: it defines the design tokens
      and the --bs-* hooks that brand Bootstrap's own components.
    -->
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/index.css" rel="stylesheet" />
    <link href="css/report-mask.css" rel="stylesheet" />
    <link href="css/report-feedback.css" rel="stylesheet" />

    <!--
      The InChI modules (one per version), the RInChI module and the NGL viewer
      are not listed here: together they are more than 10 MB, and a visit needs
      one InChI version at most. index.js pulls them in through loadScriptOnce()
      when a tab is opened or a conversion is about to run.

      Everything below is deferred, so none of it blocks the parser. Deferred
      scripts still run in document order, which is what lets the plugins below
      rely on jQuery and the components rely on all of it.
    -->
    <!-- Only bootstrap-multiselect needs jQuery. -->
    <script
      defer
      src="jquery/jquery-3.7.1.min.js"
      integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="bootstrap/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="bootstrap-multiselect/bootstrap-multiselect-1.1.2/dist/js/bootstrap-multiselect.min.js"
      integrity="sha384-0bKqY/QpXas8sskCT4hKi1EsfrCHXH7kZYNMr05pTeUbEdxf5xdjxEy1fjdU861x"
      crossorigin="anonymous"
    ></script>
    <!-- The InChI string's layer grammar: needed before the components render. -->
    <script defer src="inchi-layers.js"></script>
    <script defer src="inchi.js"></script>
    <script defer src="rinchi.js"></script>
    <script defer src="index.js"></script>
    <script defer src="components/components.js"></script>
    <script>
      var _paq = (window._paq = window._paq || []);
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(["trackPageView"]);
      _paq.push(["enableLinkTracking"]);
      (function () {
        var u = "https://matomo.beilstein.org/";
        _paq.push(["setTrackerUrl", u + "matomo.php"]);
        _paq.push(["setSiteId", "10"]);
        var d = document,
          g = d.createElement("script"),
          s = d.getElementsByTagName("script")[0];
        g.async = true;
        g.src = u + "matomo.js";
        s.parentNode.insertBefore(g, s);
      })();
    </script>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — Skeletal Notation — seed a4ec508d

      THESIS: The identifier is drawn, not printed. Line weight, wedge, hash
      and locant carry what colour usually carries. Refuses this category's
      default arrangement: four identical cards holding answer, derived answer,
      diagnostic dump and error channel as peers.

      OWN-WORLD: Cool drawing-paper ground and ink, both themes first-class.
      One institutional green, colour nowhere else except the categorical atom
      key. Three rule weights (hairline separates, rule bounds, stroke marks)
      are the hierarchy. Register marks at opposite corners of a plate. No
      radius, no shadow outside dialogs. Tracked small-caps apparatus labels.
      System mono for identifiers only, where character alignment is the data.

      STORY: A developer draws or pastes, reads the identifier as keyed layers
      rather than one opaque run, pins it, switches version, and sees which
      layer moved.

      FIRST VIEWPORT: Masthead on the page grid. Editor left, version and
      options right as margin apparatus. Beneath, the identifier as a keyed
      notation plate stamped with the version that produced it.

      DEVIATION (cited): the status line sits ABOVE the plate, not beneath it
      as this block first specified. It answers "did that work?", which is read
      before the answer itself, and on a failure there is no plate to read
      under. The announcement it drives is a separate always-present region,
      because a hidden node is out of the accessibility tree.

      FORM: Skeletal Notation, candidate 7 of 7 grounded directions, seed a4ec508d.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div class="container-md" style="margin-bottom: 2rem">
      <header class="masthead">
        <a
          href="https://www.inchi-trust.org/"
          target="_blank"
          rel="noopener"
          class="flex-none"
        >
          <img
            class="masthead-logo"
            src="img/InChI-logo2.png"
            width="180"
            height="56"
            alt="InChI Trust"
          />
        </a>
        <div class="masthead-text">
          <h1>InChI Web Demo</h1>
          <p class="masthead-tagline">
            Chemical identifiers generated in your browser, never on a server.
          </p>
        </div>
      </header>
      <noscript>You need to enable JavaScript!</noscript>

      <ul class="nav nav-pills mt-1" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="pills-inchi-tab"
            data-bs-toggle="pill"
            data-bs-target="#pills-inchi"
            type="button"
            role="tab"
            aria-controls="pills-inchi"
            aria-selected="true"
          >
            InChI
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="pills-rinchi-tab"
            data-bs-toggle="pill"
            data-bs-target="#pills-rinchi"
            type="button"
            role="tab"
            aria-controls="pills-rinchi"
            aria-selected="false"
          >
            RInChI
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="pills-about-tab"
            data-bs-toggle="pill"
            data-bs-target="#pills-about"
            type="button"
            role="tab"
            aria-controls="pills-about"
            aria-selected="false"
          >
            About
          </button>
        </li>
      </ul>

      <!-- Contents of pills -->
      <div class="tab-content">
        <!-- InChI pill -->
        <inchi-inchi-tools
          class="tab-pane fade show active"
          id="pills-inchi"
          role="tabpanel"
          aria-labelledby="pills-inchi-tab"
          tabindex="0"
        ></inchi-inchi-tools>

        <!-- RInChI pill -->
        <inchi-rinchi-tools
          class="tab-pane fade"
          id="pills-rinchi"
          role="tabpanel"
          aria-labelledby="pills-rinchi-tab"
          tabindex="0"
        ></inchi-rinchi-tools>

        <!-- About pill -->
        <!--
          defer-until-shown: the funder logos on this surface are 357 KB over
          the wire, and they were being fetched on first paint even though every
          image there is marked loading="lazy" — a lazy image inside a
          display:none tab pane has no computed position, so the browser
          fetches it immediately.
        -->
        <inchi-about
          class="tab-pane fade"
          id="pills-about"
          role="tabpanel"
          aria-labelledby="pills-about-tab"
          tabindex="0"
          defer-until-shown
        ></inchi-about>
      </div>
    </div>
  </body>
</html>
